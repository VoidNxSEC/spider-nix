{% extends "base.html" %}
{% block content %}
<div x-data="autofillApp()">
    <h1 class="text-2xl font-bold mb-6">🤖 Auto-Fill</h1>

    <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
        <div class="flex gap-3">
            <input x-model="url" placeholder="Paste job application URL here..."
                   class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
            <button @click="analyze()" :disabled="loading"
                    class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 px-6 py-2 rounded text-sm font-bold">
                🔍 Analyze Form
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
        <div class="flex items-center gap-3">
            <div class="animate-spin w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
            <span>Analyzing form fields...</span>
        </div>
    </div>

    <!-- Results -->
    <template x-for="(form, fi) in forms" :key="fi">
        <div class="bg-gray-800 rounded-lg border border-gray-700 mb-4 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
                <div>
                    <span class="font-bold" x-text="'Form ' + (fi+1) + ': ' + (form.form_purpose || 'unknown')"></span>
                    <span class="text-xs text-gray-400 ml-2" x-text="'[' + (form.platform || 'generic') + ']'"></span>
                </div>
                <div class="flex gap-2 text-xs">
                    <span class="text-green-400" x-text="'🟢 ' + (form.confidence_summary?.high || 0) + ' high'"></span>
                    <span class="text-yellow-400" x-text="'🟡 ' + (form.confidence_summary?.medium || 0) + ' med'"></span>
                    <span class="text-red-400" x-text="'🔴 ' + (form.confidence_summary?.low || 0) + ' low'"></span>
                </div>
            </div>
            <div class="p-4">
                <template x-for="field in form.fill_results || []" :key="field.field_name">
                    <div class="flex items-center gap-3 py-2 border-b border-gray-700 last:border-0"
                         :class="field.confidence >= 0.8 ? 'conf-high pl-2' : field.confidence >= 0.5 ? 'conf-medium pl-2' : field.confidence >= 0.3 ? 'conf-low pl-2' : ''">
                        <span class="text-xs w-16 text-gray-500" x-text="field.field_type"></span>
                        <div class="flex-1">
                            <div class="text-sm" x-text="field.field_name"></div>
                            <div class="text-xs text-gray-500" x-text="field.field_label || ''"></div>
                        </div>
                        <div class="flex-1">
                            <span :class="field.value ? 'text-green-400' : 'text-gray-600'"
                                  x-text="field.value ? field.value.slice(0,40) : '(empty)'"></span>
                        </div>
                        <div class="text-xs w-20 text-right">
                            <span :class="field.confidence >= 0.8 ? 'text-green-400' : field.confidence >= 0.5 ? 'text-yellow-400' : 'text-red-400'"
                                  x-text="(field.confidence * 100).toFixed(0) + '%'"></span>
                            <span class="text-gray-600 ml-1" x-text="field.matched_by"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Empty -->
    <div x-show="!loading && forms.length === 0 && !analyzed" class="text-center py-16 text-gray-500">
        <div class="text-4xl mb-3">🤖</div>
        <p>Paste a job application URL to analyze its forms.</p>
        <p class="text-sm mt-1">See which fields can be auto-filled from your profile.</p>
    </div>
</div>

<script>
function autofillApp() {
    return {
        url: '',
        loading: false,
        analyzed: false,
        forms: [],

        async analyze() {
            if (!this.url) return;
            this.loading = true;
            this.analyzed = true;
            this.forms = [];
            try {
                const r = await fetch('/api/autofill/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: this.url})
                });
                const data = await r.json();
                this.forms = data.forms || [];
            } catch(e) {
                console.error(e);
            }
            this.loading = false;
        }
    }
}
</script>
{% endblock %}
