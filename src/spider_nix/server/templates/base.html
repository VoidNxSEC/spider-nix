<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Nix — Job Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        .conf-high { border-left: 3px solid #22c55e; }
        .conf-medium { border-left: 3px solid #eab308; }
        .conf-low { border-left: 3px solid #ef4444; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🕷️</span>
                    <span class="font-bold text-lg">Spider-Nix</span>
                </div>
                <div class="flex gap-1">
                    <a href="/" class="px-3 py-2 rounded text-sm font-medium hover:bg-gray-700 transition-colors {{ 'bg-gray-700' if request.url.path == '/' else '' }}">🔍 Hunt</a>
                    <a href="/pipeline" class="px-3 py-2 rounded text-sm font-medium hover:bg-gray-700 transition-colors {{ 'bg-gray-700' if request.url.path == '/pipeline' else '' }}">📊 Pipeline</a>
                    <a href="/autofill" class="px-3 py-2 rounded text-sm font-medium hover:bg-gray-700 transition-colors {{ 'bg-gray-700' if request.url.path == '/autofill' else '' }}">🤖 Auto-fill</a>
                    <a href="/profile" class="px-3 py-2 rounded text-sm font-medium hover:bg-gray-700 transition-colors {{ 'bg-gray-700' if request.url.path == '/profile' else '' }}">👤 Profile</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 shadow-lg"></div>
</body>
</html>
