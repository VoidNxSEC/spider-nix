name: Deploy docs

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: cachix/install-nix-action@v31

            - name: Decrypt Cloudflare secrets
              run: |
                  printf '%s' "$SOPS_AGE_KEY" > /tmp/age-key.txt
                  SOPS_AGE_KEY_FILE=/tmp/age-key.txt \
                      nix develop --command sops --decrypt secrets/cloudflare.enc.env \
                      > /tmp/cf.env
                  grep -E '^[A-Z_]+=.' /tmp/cf.env >> "$GITHUB_ENV"
                  rm -f /tmp/cf.env /tmp/age-key.txt
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

            - name: Build docs
              run: nix develop --command bash -c "cd docs && mkdocs build"

            - name: Deploy main
              if: github.ref_name == 'main'
              run: |
                  nix develop --command wrangler pages deploy docs/site \
                      --project-name=spider-nix-docs \
                      --branch=main
              env:
                  CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  REF_NAME=${{ github.ref_name }}
                  MAJOR_MINOR=${REF_NAME%.*}
                  nix develop --command wrangler pages deploy docs/site \
                      --project-name=spider-nix-docs \
                      --branch="${MAJOR_MINOR}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
