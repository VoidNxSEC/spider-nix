name: Nix Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Portfolio Value: Demonstrates NixOS expertise and reproducible build practices
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Nix flake
        run: nix flake check

      - name: Build Nix package
        run: nix build .#default

      - name: Build Go proxy package
        run: nix build .#spider-network-proxy

      - name: Test in Nix devShell
        run: nix develop --command spider ci-local
