name: Complete CI Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Stage 1: Pre-commit Validation
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt,pyproject.toml,setup.py'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # Stage 2: Code Quality (Parallel Jobs)
  lint:
    name: Linting (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check src/ tests/ --output-file=ruff-report.txt

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruff-lint-report
          path: ruff-report.txt
          retention-days: 7

  format-check:
    name: Format Check (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Checking (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/spider_nix --config-file=pyproject.toml

  # Stage 3: Security Scanning (Parallel)
  security-static:
    name: Static Security (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json -ll || true
          bandit -r src/ -f screen -ll

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  security-ruff:
    name: Ruff Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff security rules
        run: ruff check . --select S,B --output-file=ruff-security-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruff-security-report
          path: ruff-security-report.txt
          retention-days: 7

  # Stage 4: Dependency Security
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install package
        run: pip install -e .

      - name: Install scanners
        run: pip install safety pip-audit

      - name: Run Safety
        continue-on-error: true
        run: safety check --json --output safety-report.json || true

      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit --format json --output pip-audit-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-reports
          path: |
            safety-report.json
            pip-audit-report.json
          retention-days: 30

  # Stage 5: Matrix Testing
  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [lint, format-check, typecheck, security-static, security-ruff, dependency-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt,pyproject.toml,setup.py'

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -m "not slow and not integration" \
            --cov=spider_nix \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: spider-nix-coverage
          fail_ci_if_error: false

  # Stage 6: Integration Tests
  integration:
    name: Integration Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium firefox webkit

      - name: Install package with all dependencies
        run: pip install -e ".[dev,resume]"

      - name: Run integration tests
        run: |
          pytest tests/ \
            -m "integration" \
            --cov=spider_nix \
            --cov-report=xml \
            --junitxml=integration-results.xml \
            -v --tb=short
        continue-on-error: true

      - name: Upload integration results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml
          retention-days: 14

  # Stage 7: Build Validation
  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build tools
        run: pip install build hatchling

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution
        run: |
          ls -lh dist/
          pip install dist/*.whl
          spider-nix --version
          spider --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          retention-days: 30

  # Stage 8: Docker Build (CI only, no push)
  docker-build:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/docker-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # Final summary job
  summary:
    name: CI Summary
    needs: [test, integration, build, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Job Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-commit: ${{ needs.pre-commit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ${{ needs.format-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security (Bandit): ${{ needs.security-static.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security (Ruff): ${{ needs.security-ruff.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          for version in 3.11 3.12 3.13; do
            echo "- Python $version: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Build & Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: ${{ needs.integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All critical checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi
