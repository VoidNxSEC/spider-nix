[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spider-nix"
version = "0.0.1"
description = "Security Tooling"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "marcosfpina" },
]
keywords = [
  "job-search",
  "job-tracker",
  "autofill",
  "ats",
  "crawler",
  "osint",
  "scraping",
  "playwright",
  "nix",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiodns>=3.2",
  "aiohttp>=3.10",
  "aiosqlite>=0.20",
  "beautifulsoup4>=4.12",
  "defusedxml>=0.7",
  "fake-useragent>=1.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "lxml>=5.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=10.4",
  "playwright>=1.48",
  "pycares>=4.4",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "python-whois>=0.9",
  "pyyaml>=6.0",
  "rich>=13.8",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7",
  "build>=1.2",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "ruff>=0.6",
]
resume = [
  "pdfplumber>=0.11",
  "pypdf>=5.0",
]

[project.urls]
Homepage = "https://github.com/VoidNxSEC/spider-nix"
Repository = "https://github.com/VoidNxSEC/spider-nix"
Issues = "https://github.com/VoidNxSEC/spider-nix/issues"

[project.scripts]
spider = "spider_nix.cli:app"
spider-nix = "spider_nix.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_nix"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/src",
  "/tests",
]
exclude = [
  "*.db",
  "*.db-journal",
  "*.db-shm",
  "*.db-wal",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
]

[tool.hatch.build]
artifacts = [
  "src/spider_nix/intel/templates/*.yaml",
  "src/spider_nix/ml/*.sql",
  "src/spider_nix/osint/wordlists/*.txt",
  "src/spider_nix/server/templates/*.html",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=spider_nix",
  "--cov-report=term-missing",
]
asyncio_mode = "auto"
markers = [
  "integration: tests that require external network or services",
  "slow: slower browser, network, or anti-detection tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["spider_nix"]
omit = [
  "tests/*",
  "src/spider_nix/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["spider_nix"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = false

[tool.bandit]
exclude_dirs = [
  "tests",
  ".git",
  ".pytest_cache",
  ".ruff_cache",
]
skips = [
  "B101",
  "B404",
  "B603",
  "B607",
]
